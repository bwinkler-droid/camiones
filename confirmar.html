@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rqtol{color:#fbbf24}}:root[data-theme="dark"] .rqtol{color:#fbbf24}
.rqres{margin-top:8px;border-radius:12px;background:rgba(34,197,94,.10);padding:8px 12px}.rqres>div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:6px 0;border-bottom:1px solid rgba(34,197,94,.25);font-size:16px}.rqres>div:last-of-type{border-bottom:0}.rqres span{color:var(--mut)}

.rqbh label.rqnp{display:inline-flex!important;align-items:center;gap:6px;margin:0!important;font-size:13.5px!important;color:#dc2626!important;font-weight:700!important;text-transform:none!important;letter-spacing:0!important;white-space:nowrap}.rqbh label.rqnp input{width:20px!important;height:20px!important;margin:0!important;flex:none}
.rqtm.rqno{border-color:#ef4444!important;background:rgba(239,68,68,.06)}.rqau{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(127,127,127,.15);color:var(--mut);margin-left:4px}
</style></head>
<body>
<script>
/* Página pública para que los transportes confirmen los camiones (se abre con el link que manda Logística por WhatsApp).
   Vive fuera de script.google.com para que funcione en cualquier celular, aunque tenga varias cuentas de Google abiertas.
   El link trae dos datos: r = código del pedido y s = identificador del servidor (implementación de Apps Script).
   Esta página no guarda nada: solo muestra el pedido y envía la respuesta al servidor del portal. */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* versión de esta página: el servidor rechaza las páginas viejas (RQ_PAGE_MIN) y esta página avisa si el servidor todavía no se actualizó.
   La misma página sirve en GitHub Pages (?r=código&s=servidor) y como archivo "Confirmar" del proyecto (el servidor le pasa __RQK y __SRV). */
const PAGE_V=17,NEED_SRV='2026-11-10d';
const QS=new URLSearchParams(location.search),RK=(window.__RQK||QS.get('r')||'').replace(/[^A-Za-z0-9.]/g,''),SID=(QS.get('s')||'').replace(/[^A-Za-z0-9_-]/g,'');
const SRV=window.__SRV||(SID?'https://script.google.com/macros/s/'+SID+'/exec':'');
async function api(a,p={}){const r=await fetch(SRV,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,pv:PAGE_V,...p}),redirect:'follow',credentials:'omit'});
 const j=await r.json();if(j.err)throw new Error(j.err);return j}
const fmtHs=x=>String(Math.round(x*100)/100).replace('.',',');
/* Jornada y descanso: son las MISMAS reglas del servidor (archivo Reglas de Apps Script). Llegan con la página (archivo Confirmar)
   o con el primer pedido (GitHub Pages). Los trabajos del chofer se pasan como tareas sueltas identificadas por su DNI.
   Si por algún motivo no llegaron, el link no controla y el servidor igual valida todo al recibir la respuesta. */
const RGok=()=>typeof restErr==='function'&&typeof inicioJornada==='function'&&typeof jornadaPrevia==='function';
function rgT(S,dni,nm){const N={},L=S.map((z,k)=>{N['w'+k]=z.u||'';return {f:'w'+k,s:z.s,e:z.e,c:'C',chAlt:nm||'X',dniAlt:dni}});return {L,fo:id=>({t:'',tr:N[id]||''})}}
/* por qué el chofer no puede manejar de s a e ('' si puede); lim: jornada máxima de este tramo */
function rgWhy(S,dni,nm,s,e,lim,fmt){if(!RGok())return '';nm=nm||'El chofer';const x={f:'cur',s,e,c:'C',chAlt:nm,dniAlt:dni},T=rgT(S,dni,nm),no=()=>false;
 return restErr(x,T.L,T.fo,no,fmt,true)||restErr(x,T.L,T.fo,no,fmt,false,lim)||''}
/* desde cuándo viene la jornada si maneja desde t, y la última jornada terminada antes de t ({s,e,des}) */
function rgIni(S,dni,t){if(!RGok()||!dni)return t;const T=rgT(S,dni);return inicioJornada({f:'cur',s:t,e:t,chAlt:'X',dniAlt:dni},T.L,T.fo)}
function rgPrev(S,dni,t){if(!RGok()||!dni)return null;const T=rgT(S,dni);return jornadaPrevia({f:'cur',s:t,e:t,chAlt:'X',dniAlt:dni},T.L,T.fo)}
function rqFit(){try{const sw=Math.min(screen.width||0,screen.height||0)||window.innerWidth,r=window.innerWidth/sw;document.body.style.zoom=(sw<900&&r>1.2)?r.toFixed(3):''}catch(e){}}
async function rqPage(k){document.title='TPR · Confirmación de camiones';if(!window.__rqfit){window.__rqfit=1;window.addEventListener('resize',rqFit);window.addEventListener('orientationchange',()=>setTimeout(rqFit,300))}
 let mv=document.querySelector('meta[name=viewport]');if(!mv){mv=document.createElement('meta');mv.name='viewport';document.head.appendChild(mv)}mv.content='width=device-width, initial-scale=1, viewport-fit=cover';
 rqFit();document.body.innerHTML=`${window.__TEST?'<div id="tstbar">🧪 ENTORNO DE PRUEBA</div>':''}<div class="rqw" id="rqw"><div class="rqhd"><div class="k">TPR · Confirmación de camiones</div><div class="sub">Cargando…</div></div></div>`;
 const W=document.getElementById('rqw'),E=s=>esc(s),errTxt=x=>x.message==='Failed to fetch'?'No hay conexión. Probá de nuevo.':x.message;
 /* un link puede traer varios pedidos del mismo transporte (códigos separados por punto): se muestran todos juntos */
 const KS=String(k).split('.').filter(x=>x.length>=20).slice(0,10);let DS;
 try{DS=await Promise.all(KS.map((c,ix)=>api('rq.get',Object.assign({k:c},!ix&&!RGok()?{rg:1}:{})).then(d=>Object.assign(d,{k:c})).catch(x=>({k:c,err:errTxt(x)}))))}catch(x){DS=[{err:errTxt(x)}]}
 /* servidor más viejo que esta página (se subió la página antes de publicar el código): no se deja responder con datos que no entendería */
 if(DS.some(d=>!d.err&&(!d.bv||d.bv<NEED_SRV))){W.innerHTML=`<div class="rqhd"><div class="k">TPR · Confirmación de camiones</div></div><div class="rqer">El sistema se está actualizando. Probá de nuevo en unos minutos con este mismo link.</div>`;return}
 {const g=DS.find(d=>d&&d.reglas);if(g&&!RGok())try{(0,eval)(g.reglas)}catch(x){}}
 const OKS=DS.filter(d=>!d.err);
 if(!OKS.length){W.innerHTML=`<div class="rqhd"><div class="k">TPR · Confirmación de camiones</div></div><div class="rqer">${E((DS[0]||{}).err||'El link no es válido.')}</div>`;return}
 if(OKS.some(d=>d.test)&&!document.getElementById('tstbar'))document.body.insertAdjacentHTML('afterbegin','<div id="tstbar">🧪 ENTORNO DE PRUEBA</div>');
 const NU=s=>String(s||'').trim().replace(/\s+/g,' ').toUpperCase(),DG=s=>String(s||'').replace(/\D/g,''),PN=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 const DL=[];OKS.forEach(d=>(d.drivers||[]).forEach(z=>{if(!DL.some(y=>y.n===z.n))DL.push(z)}));
 const dniOf=n=>{const z=DL.find(y=>y.n===NU(n));return z?z.dni:''},MAXH=OKS[0].maxh;
 const drvIn=(id,lab,v)=>`<div class="tt">${lab}</div><div class="rqd"><div><label for="${id}n">Nombre y apellido</label><input list="rqdl" id="${id}n" autocomplete="off" value="${E((v&&v.n)||'')}" placeholder="Elegí de la lista" style="text-transform:uppercase"></div><div><label for="${id}d">DNI</label><input id="${id}d" inputmode="numeric" maxlength="10" value="${E((v&&v.dni)||'')}" placeholder="Sin puntos"></div></div>`;
 const TH=D=>D.units.length?Math.max(...D.units.map(u=>u.e))-Math.min(...D.units.map(u=>u.s)):0,isDone=D=>!!D.done&&/^Ya respondiste/.test(D.closed||'');
 const multi=OKS.length>1,open=OKS.filter(D=>!D.closed),U=[];   /* U: todas las unidades de la página, en orden */
 /* hora local (el servidor manda horas "locales como UTC"), mismo formato que el servidor: "mar 03/11 10:00" */
 const fL=h=>{const d=new Date(Math.round(h*60)*6e4),p=n=>String(n).padStart(2,'0');return ['dom','lun','mar','mié','jue','vie','sáb'][d.getUTCDay()]+' '+p(d.getUTCDate())+'/'+p(d.getUTCMonth()+1)+' · '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())};
 const opLine=D=>`<div class="rqop">${E(D.op)}${D.bq?`<span class="bq">🚢 ${E(D.bq)}</span>`:''}</div>`;
 /* aviso de relevo: el tramo de la unidad supera MAXH h → los choferes se alternan cada MAXH h */
 const relHtml=u=>{if(!(u.h>MAXH))return '';const ch=[];for(let t=u.s+MAXH,n=1;t<u.e-1e-9&&ch.length<8;t+=MAXH,n++)ch.push({t,who:n%2?'entra el que releva':'vuelve el que arrancó'});
   return `<div class="rqrl"><span class="t">⚠ Turno de ${fmtHs(u.h)} h: necesita relevo</span>Un chofer no puede manejar más de ${MAXH} h seguidas. El que arranca trabaja hasta el <b>${E(fL(ch[0].t))}</b> y ahí lo reemplaza el que releva.${ch.length>1?`<ul>${ch.map(c=>`<li><b>${E(fL(c.t))}</b>: ${c.who}</li>`).join('')}</ul>`:''}</div>`};
 /* respuesta ya enviada: un renglón por tramo con día y hora, y un botón para copiarla (por ejemplo, para mandársela a los choferes) */
 /* unidad que efectivamente va, según la respuesta: si el transporte cambió el camión (toda la unidad o todos los tramos con
    el mismo), esa pasa a ser la que se muestra arriba, con «en lugar de» la citada; si usó varios, cada tramo dice en cuál va */
 const goes=u=>{const r=u.res||{};if(!u.res||!r.ok)return null;const T=r.tr||[],us=[...new Set(T.map(z=>z.u||''))];
  if(T.length&&us.length===1&&us[0])return {nm:us[0],all:1};if(r.ufN)return {nm:r.ufN,all:!us.some(x=>x)};return us.some(x=>x)?{nm:'',all:0}:null};
 const tmTxt=z=>{const a=fL(z.s),b=fL(z.e);return a+' a '+(a.slice(0,9)===b.slice(0,9)?b.slice(-5):b)};
 /* patentes de una unidad: principal y segunda (en chasis TPR manda el semi) */
 const plOf=v=>{const t=v.tipo==='Chasis TPR'&&v.sm;return {a:t?v.sm:v.tr,b:t?v.tr:(v.sm||'')}};
 const plTxt=v=>{const p=plOf(v);return p.a+(p.b?' / '+p.b:'')};
 /* la unidad que va: con sus dos patentes si el servidor las mandó (u.un), si no solo el nombre corto */
 const goesPl=(u,g)=>g&&g.nm?((u.un||{})[g.nm]?plOf(u.un[g.nm]):{a:g.nm,b:''}):null;
