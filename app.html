<title>TPR · Camiones</title>
<style>
:root{--navy:#213C74;--gold:#9D832F;--bg:#F3F5F9;--card:#fff;--fg:#17223A;--mut:#64708A;--line:#E1E6EF;--ok:#0F7A55;--okb:#E1F5EE;--wa:#8A5A0B;--wab:#FAEEDA;--bad:#B42318;--badb:#FCEBEB;--inf:#0C447C;--infb:#E6F1FB;color-scheme:light}

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .lg{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.top .lg img{height:30px}
.top .tt{flex:1;min-width:0}.top b{font-size:16px;display:block}.top small{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 9px;font-size:13px}
.gold{height:3px;background:var(--gold)}
.sal{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:1px}
main{padding:12px 12px calc(86px + env(safe-area-inset-bottom,0px))}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.kp b{display:block;font-size:22px}.kp span{font-size:11.5px;color:var(--mut)}
.h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 7px}.h2{font-size:13px;font-weight:700;margin:12px 4px 6px}
.cd,.u2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:9px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.op{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.op i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hr{font-size:12.5px;color:var(--mut);margin-top:2px}
.bar{height:8px;border-radius:5px;background:var(--line);margin:9px 0 6px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;flex:none}.u>div:first-child{min-width:0;flex:1}.c-ok{background:var(--okb);color:var(--ok)}.c-wa{background:var(--wab);color:var(--wa)}.c-bad{background:var(--badb);color:var(--bad)}.c-inf{background:var(--infb);color:var(--inf)}
.nw{font-size:11px;font-weight:700;color:var(--inf)}
.al,.u{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;font-size:14px}.u{justify-content:space-between;align-items:center}
.al .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.al small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.tap{cursor:pointer}.tap:active{opacity:.7}.off{opacity:.55}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mut)}.fl b{font-size:22px;display:block;color:var(--fg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ab{display:inline-block;text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;background:var(--infb);color:var(--inf)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{border:0;background:transparent;padding:9px 0 11px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}nav button i{font-size:20px;font-style:normal}nav button.on{color:var(--navy)}
@media (prefers-color-scheme:dark){nav button.on{color:#9CC5F0}}
.bdg{background:#D03B3B;color:#fff;border-radius:999px;font-size:10px;padding:0 6px;margin-left:2px}
.empty{text-align:center;color:var(--mut);padding:22px 10px;font-size:14px}
#ov{display:none}#ov.on{display:block;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
.shh{position:sticky;top:0;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;border-bottom:3px solid var(--gold);z-index:2}.shh b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shh button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;font-size:22px;line-height:1;padding:4px 12px}
.shb{padding:12px 12px calc(30px + env(safe-area-inset-bottom,0px))}
.big{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--navy);color:#fff;margin:4px 0 8px}
.ghost{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px;font-weight:600;background:var(--card);color:var(--fg);margin-top:8px}
.opt{display:flex;gap:7px;flex-wrap:wrap}.opt label{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;background:var(--card)}.opt label.on{border-color:var(--navy);background:var(--infb);color:var(--inf);font-weight:700}.opt input{display:none}
.two{display:grid;grid-template-columns:1fr;gap:8px}.two label{font-size:12.5px;color:var(--mut)}.two input,.qi{display:block;width:100%;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-top:3px}
.ck{display:flex;gap:8px;align-items:center;background:var(--wab);color:var(--wa);border-radius:12px;padding:11px 12px;margin-top:10px;font-weight:600;font-size:14px}.ck input{width:20px;height:20px}
.err{color:var(--bad);font-size:13.5px;margin-top:10px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#17223A;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:30;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}#toast.on{opacity:1;transform:none}
.lgn{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 96px) 22px 28px;background:linear-gradient(170deg,var(--navy) 0 42%,var(--bg) 42%)}
.lgn .box{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lgn .lgw{display:flex;justify-content:center;margin:-62px 0 12px}.lgn .lgw div{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.15)}.lgn .lgw img{height:92px;display:block}
.lgn h1{text-align:center;font-size:19px;margin:4px 0 2px}.lgn p{text-align:center;color:var(--mut);margin:0 0 16px;font-size:13.5px}
.lgn label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}.lgn input{width:100%;font-size:17px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lgn button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:700}
.lgn .err{text-align:center}.foot{font-size:11.5px;color:var(--mut);text-align:center;margin-top:14px}
.vt{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0 2px}
.seg2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg2 button{border:0;background:transparent;padding:8px 11px;font-size:13px;color:var(--mut);font-weight:600}.seg2 button.on{background:var(--navy);color:#fff}
.nd{border:0;border-radius:12px;background:var(--gold);color:#fff;font-weight:700;padding:9px 12px;font-size:13px}
.st{font-size:12.5px;font-weight:700;margin-top:3px;padding:2px 8px;border-radius:8px;display:inline-block}.go{color:var(--mut);font-size:22px;flex:none}
.big.ok{background:#0F7A55}
.tlw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;-webkit-overflow-scrolling:touch}.tli{position:relative;padding:28px 0 8px}
.tlhd{position:absolute;top:0;left:0;right:0;height:24px;border-bottom:1px solid var(--line)}.tlh{position:absolute;top:5px;font-size:11px;color:var(--mut);padding-left:3px;border-left:1px solid var(--line);height:900px}.tlh.tday{color:var(--fg);font-weight:700;border-left:2px solid var(--fg)}
.tlr{position:relative;height:38px}.tlb{position:absolute;top:4px;height:30px;border-radius:8px;padding:6px 8px;font-size:12px;color:#17223A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tlnow{position:absolute;top:0;bottom:0;width:2px;background:#E24B4A}
.ut{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.ut>span{width:72px;flex:none;font-weight:700;line-height:1.1}.ut>span small{display:block;font-weight:500;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.utb{position:relative;flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}.utb i{position:absolute;top:0;bottom:0;border-radius:7px}.utb em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#E24B4A}
select.qi,textarea.qi{font-family:inherit}
#wash{display:none}#wash.on{display:flex;position:fixed;inset:0;z-index:40;background:rgba(15,21,34,.55);align-items:flex-end}
.wsb{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.wsb>b{font-size:16px;display:block;margin-bottom:6px}.wsg{background:var(--infb);color:var(--inf);border-radius:12px;padding:9px 12px;margin:6px 0;font-size:14px}
.wsp{white-space:pre-wrap;font:12.5px/1.4 system-ui,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--mut);margin:8px 0}
.lgn .lgw img.lgh{height:auto;width:230px;max-width:70vw}
.utb b{position:absolute;top:0;bottom:0;width:1px;background:rgba(127,127,127,.35)}.utb i.chg{box-shadow:inset 2px 0 0 #fff}.utb i.miss{background:transparent!important;border:1.5px dashed var(--bad);border-radius:7px;box-sizing:border-box}
.utk{display:flex;gap:8px;font-size:10.5px;color:var(--mut);height:14px}.utk>span{width:72px;flex:none}.utk>div{position:relative;flex:1}.utk i{position:absolute;font-style:normal;transform:translateX(-50%);white-space:nowrap}
