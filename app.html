<title>TPR · Camiones</title>
<style>
:root{--navy:#213C74;--gold:#9D832F;--bg:#F3F5F9;--card:#fff;--fg:#17223A;--mut:#64708A;--line:#E1E6EF;--ok:#0F7A55;--okb:#E1F5EE;--wa:#8A5A0B;--wab:#FAEEDA;--bad:#B42318;--badb:#FCEBEB;--inf:#0C447C;--infb:#E6F1FB;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1522;--card:#18202F;--fg:#E8ECF4;--mut:#93A0B8;--line:#2A3446;--okb:#123A2D;--ok:#5DCAA5;--wab:#3B2C0F;--wa:#F2C46B;--badb:#3D1818;--bad:#F09595;--infb:#132B47;--inf:#9CC5F0;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .lg{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.top .lg img{height:30px}
.top .tt{flex:1;min-width:0}.top b{font-size:16px;display:block}.top small{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 9px;font-size:13px}
.gold{height:3px;background:var(--gold)}
.sal{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:1px}
main{padding:12px 12px calc(86px + env(safe-area-inset-bottom,0px))}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.kp b{display:block;font-size:22px}.kp span{font-size:11.5px;color:var(--mut)}
.h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 7px}.h2{font-size:13px;font-weight:700;margin:12px 4px 6px}
.cd,.u2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:9px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.op{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.op i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hr{font-size:12.5px;color:var(--mut);margin-top:2px}
.bar{height:8px;border-radius:5px;background:var(--line);margin:9px 0 6px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;flex:none}.u>div:first-child{min-width:0;flex:1}.c-ok{background:var(--okb);color:var(--ok)}.c-wa{background:var(--wab);color:var(--wa)}.c-bad{background:var(--badb);color:var(--bad)}.c-inf{background:var(--infb);color:var(--inf)}
.nw{font-size:11px;font-weight:700;color:var(--inf)}
.al,.u{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;font-size:14px}.u{justify-content:space-between;align-items:center}
.al .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.al small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.tap{cursor:pointer}.tap:active{opacity:.7}.off{opacity:.55}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mut)}.fl b{font-size:22px;display:block;color:var(--fg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ab{display:inline-block;text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;background:var(--infb);color:var(--inf)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{border:0;background:transparent;padding:9px 0 11px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}nav button i{font-size:20px;font-style:normal}nav button.on{color:var(--navy)}
@media (prefers-color-scheme:dark){nav button.on{color:#9CC5F0}}
.bdg{background:#D03B3B;color:#fff;border-radius:999px;font-size:10px;padding:0 6px;margin-left:2px}
.empty{text-align:center;color:var(--mut);padding:22px 10px;font-size:14px}
#ov{display:none}#ov.on{display:block;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
.shh{position:sticky;top:0;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;border-bottom:3px solid var(--gold);z-index:2}.shh b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shh button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;font-size:22px;line-height:1;padding:4px 12px}
.shb{padding:12px 12px calc(30px + env(safe-area-inset-bottom,0px))}
.big{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--navy);color:#fff;margin:4px 0 8px}
.ghost{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px;font-weight:600;background:var(--card);color:var(--fg);margin-top:8px}
.opt{display:flex;gap:7px;flex-wrap:wrap}.opt label{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;background:var(--card)}.opt label.on{border-color:var(--navy);background:var(--infb);color:var(--inf);font-weight:700}.opt input{display:none}
.two{display:grid;grid-template-columns:1fr;gap:8px}.two label{font-size:12.5px;color:var(--mut)}.two input,.qi{display:block;width:100%;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-top:3px}
.ck{display:flex;gap:8px;align-items:center;background:var(--wab);color:var(--wa);border-radius:12px;padding:11px 12px;margin-top:10px;font-weight:600;font-size:14px}.ck input{width:20px;height:20px}
.err{color:var(--bad);font-size:13.5px;margin-top:10px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#17223A;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:30;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}#toast.on{opacity:1;transform:none}
.lgn{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 96px) 22px 28px;background:linear-gradient(170deg,var(--navy) 0 42%,var(--bg) 42%)}
.lgn .box{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lgn .lgw{display:flex;justify-content:center;margin:-62px 0 12px}.lgn .lgw div{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.15)}.lgn .lgw img{height:92px;display:block}
.lgn h1{text-align:center;font-size:19px;margin:4px 0 2px}.lgn p{text-align:center;color:var(--mut);margin:0 0 16px;font-size:13.5px}
.lgn label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}.lgn input{width:100%;font-size:17px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lgn button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:700}
.lgn .err{text-align:center}.foot{font-size:11.5px;color:var(--mut);text-align:center;margin-top:14px}
.vt{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0 2px}
.seg2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg2 button{border:0;background:transparent;padding:8px 11px;font-size:13px;color:var(--mut);font-weight:600}.seg2 button.on{background:var(--navy);color:#fff}
.nd{border:0;border-radius:12px;background:var(--gold);color:#fff;font-weight:700;padding:9px 12px;font-size:13px}
.st{font-size:12.5px;font-weight:700;margin-top:3px;padding:2px 8px;border-radius:8px;display:inline-block}.go{color:var(--mut);font-size:22px;flex:none}
.big.ok{background:#0F7A55}
.tlw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;-webkit-overflow-scrolling:touch}.tli{position:relative;padding:28px 0 8px}
.tlhd{position:absolute;top:0;left:0;right:0;height:24px;border-bottom:1px solid var(--line)}.tlh{position:absolute;top:5px;font-size:11px;color:var(--mut);padding-left:3px;border-left:1px solid var(--line);height:900px}.tlh.tday{color:var(--fg);font-weight:700;border-left:2px solid var(--fg)}
.tlr{position:relative;height:38px}.tlb{position:absolute;top:4px;height:30px;border-radius:8px;padding:6px 8px;font-size:12px;color:#17223A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tlnow{position:absolute;top:0;bottom:0;width:2px;background:#E24B4A}
.ut{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.ut span{width:64px;flex:none;font-weight:700}.utb{position:relative;flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}.utb i{position:absolute;top:0;bottom:0;border-radius:7px}.utb em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#E24B4A}
select.qi,textarea.qi{font-family:inherit}
#wash{display:none}#wash.on{display:flex;position:fixed;inset:0;z-index:40;background:rgba(15,21,34,.55);align-items:flex-end}
.wsb{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.wsb>b{font-size:16px;display:block;margin-bottom:6px}.wsg{background:var(--infb);color:var(--inf);border-radius:12px;padding:9px 12px;margin:6px 0;font-size:14px}
.wsp{white-space:pre-wrap;font:12.5px/1.4 system-ui,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--mut);margin:8px 0}

 if(v.k==='u'&&$('#gpb'))$('#gpb').onclick=async()=>{const b=$('#gpb');b.disabled=true;b.textContent='Buscando…';try{const j=await api('gpspos',{f:v.id});$('#gpr').innerHTML=`Último reporte: ${j.t?new Date(j.t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}${j.speed!=null?' · '+Math.round(j.speed)+' km/h':''}${j.addr?'<br>'+esc(j.addr):''}<br><a class="ab" href="https://www.google.com/maps?q=${j.lat},${j.lon}" target="_blank" rel="noopener">🗺 Abrir en el mapa</a>`;b.remove()}catch(e){$('#gpr').textContent=e.message;b.disabled=false;b.textContent='📍 Ver dónde está ahora'}};

 if(v.k==='d'&&$('#dcf')){const d=ST.dm.find(x=>x.id===v.id);$('#dcf').onclick=async()=>{const er=$('#dcer');er.textContent='';let op={k:'dm.confirm',id:d.id};

 if(v.k==='e'){const x=ST.ev.find(z=>z.id===v.id),er=()=>$('#ever');

 $('#nbq').oninput=e=>{let v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');v=v.slice(0,3)+(v.length>3?'-'+v.slice(3,6):'')+(v.length>6?'-'+v.slice(6,8):'');e.target.value=v};
 $('#nok').onclick=async()=>{const er=$('#ner');er.textContent='';const o=$('#no').value,s=pH($('#ns').value),e=pH($('#ne').value),v=Math.floor(+$('#nv').value),u=$('#nu').value.trim(),bq=$('#nbq').value.trim();

/* ---------- eventos: cargar y editar (mismos campos que el portal) ---------- */
function evV(x,over){return Object.assign({f:x.f,t:x.t,tr:x.tr,sm:x.sm,ch:x.ch,o:x.o,s:x.s,e:x.e,dm:x.dmn,c:x.c,ty:x.ty,txt:x.txt,out:!!x.out,st:x.st,seg:x.seg},over||{})}
function evForm(x,fid){const f0=x?x.f:(fid?+fid:''),s0=x?x.s:Math.floor(ST.now*4)/4*60,F=ST.fl.slice().sort((a,b)=>a.un.localeCompare(b.un));
 return `<div class="h">Unidad</div><select id="eu" class="qi"><option value="">— Elegí la unidad —</option>${F.map(f=>`<option value="${f.id}" ${f.id==f0?'selected':''}>${esc(f.un)} · ${esc(f.t)}</option>`).join('')}</select>
  <div class="h">Chofer</div><input id="ech" class="qi" list="echl" value="${esc(x?x.ch:'')}" placeholder="Nombre del chofer"><datalist id="echl"></datalist>
  <div class="h">Operación</div><select id="eo" class="qi"><option value="">—</option>${Object.keys(ST.ops).map(k=>`<option value="${k}" ${x&&x.o===k?'selected':''}>${esc(ST.ops[k])}</option>`).join('')}</select>
  <div class="h">Motivo</div><select id="ec" class="qi">${CLS.map(c=>`<option ${x&&x.c===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <div class="h">Responsable</div><select id="et" class="qi">${RESP.map(r=>`<option ${x&&x.ty===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
  <label class="ck" style="background:var(--infb);color:var(--inf)"><input type="checkbox" id="eout" ${x?(x.out?'checked':''):''}> Deja al camión fuera de servicio</label>
  <div class="h">Horario</div><div class="two"><label>Inicio<input type="datetime-local" step="900" id="es" value="${fMin(s0)}"></label><label>Fin (vacío si sigue)<input type="datetime-local" step="900" id="ee" value="${x&&x.e!=null?fMin(x.e):''}"></label></div>

  <div class="err" id="eer"></div><button class="big" id="eok">${x?'Guardar cambios':'Cargar evento'}</button>`}
function evWire(id){const x=id&&!id.startsWith('+')?ST.ev.find(z=>z.id===id):null;
 const drv=()=>{const f=fl(+$('#eu').value);$('#echl').innerHTML=[f.ch,f.ch2].filter(Boolean).map(n=>`<option value="${esc(n)}">`).join('');if(!x&&!$('#ech').value&&f.ch)$('#ech').value=f.ch;
  if(!x){const n=nowOf(f);if(n&&!$('#eo').value)$('#eo').value=n.o}};$('#eu').onchange=drv;drv();
 const rs=()=>{const c=$('#ec').value;if(!x){$('#et').value=DEFR[c]||'Chofer';$('#eout').checked=(ST.outm||[]).includes(c)}};$('#ec').onchange=rs;if(!x)rs();
 $('#eok').onclick=async()=>{const er=$('#eer');er.textContent='';const fid=$('#eu').value,s=pMin($('#es').value),e=$('#ee').value?pMin($('#ee').value):null;
  if(!fid){er.textContent='Elegí la unidad.';return}if(!(s>0)){er.textContent='Indicá el inicio.';return}if(e!=null&&!(e>s)){er.textContent='El fin tiene que ser después del inicio.';return}
  const f=fl(+fid),v={f:+fid,t:f.t,tr:f.tr,sm:f.sm,ch:$('#ech').value.trim(),o:$('#eo').value,s,e,c:$('#ec').value,ty:$('#et').value,txt:$('#etx').value.trim(),out:$('#eout').checked};

/* ---------- asignar ---------- */
const span=d=>{const s=Math.max(d.s,Math.ceil(ST.now*4)/4);return [s,d.e]};
function why(d,f){const [s,e]=span(d),ok=ST.opt[d.o];if(ok&&!ok.includes(f.tipo))return 'no sirve para '+d.on;if(f.mant)return 'en mantenimiento';if(f.nc)return 'marcada para no citar';
 const ov=ST.as.find(a=>a.f==f.id&&a.s<e&&a.e>s);if(ov){const dd=ST.dm.find(x=>x.id===ov.d);return ov.d===d.id?'ya está en esta demanda':'ocupada '+fh(ov.s)+'–'+fh(ov.e)+(dd?' ('+dd.on+')':'')}
 const rj=ST.rj.find(x=>x.f==f.id&&x.s<e&&x.e>s);if(rj)return '🚫 rechazó ('+(rj.why||'sin motivo')+')';return ''}
function asgList(d){const L=ST.fl.filter(f=>!ST.opt[d.o]||ST.opt[d.o].includes(f.tipo)).map(f=>({f,w:why(d,f)})).sort((a,b)=>(!!a.w-!!b.w)||a.f.h14-b.f.h14);
 const [s,e]=span(d);return `<div class="hr" style="margin:2px 2px 8px">Unidades que sirven para ${esc(d.on)}, de ${fh(s)} a ${fh(e)}, ordenadas por las que menos trabajaron en 14 días. Faltan <b>${d.falta}</b>.</div>
  ${L.map(x=>`<div class="u ${x.w?'off':'tap'}" ${x.w?'':`data-o="x:${x.f.id}" data-d="${d.id}"`}><div><b>${esc(x.f.un)}</b>${x.f.tipo==='Chasis TPR'?' · '+esc(x.f.tr):x.f.sm?' / '+esc(x.f.sm):''}<div class="hr">${esc(x.f.t)} · ${x.f.h14} h · ${x.f.gps?'🟢 GPS':'🔴 sin GPS'}${x.w?' · '+esc(x.w):''}</div></div><span class="chip ${x.w?'c-bad':'c-inf'}">${x.w?'no':'elegir ›'}</span></div>`).join('')||'<div class="empty">No hay unidades que sirvan para esta operación.</div>'}`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-o^="x:"]');if(!t)return;e.stopPropagation();e.preventDefault();VIEW.push({k:'x',id:t.dataset.o.split(':')[1],d:t.dataset.d});history.pushState({},'');paint()},true);
function asgForm(d,f){const [s,e]=span(d),two=!!f.ch2,def=two||e-s>12?'T':'1';
 return `<div class="cd"><b>${esc(f.un)}</b>${f.tipo==='Chasis TPR'?' · '+esc(f.tr):f.sm?' / '+esc(f.sm):''}<div class="hr">${esc(f.t)} · ${f.gps?'🟢 GPS':'🔴 sin GPS'}</div></div>
  <div class="h">Chofer</div><div class="opt" id="och">${[['T','🔗 Lo define el transporte'],['1',f.ch||'Chofer 1'],...(two?[['2',f.ch2]]:[])].map(([k,l])=>`<label class="${k===def?'on':''}"><input type="radio" name="ch" value="${k}" ${k===def?'checked':''}>${esc(l)}</label>`).join('')}</div>
  <div class="h">Horario</div><div class="two"><label>Desde<input type="datetime-local" step="900" id="xs" value="${fH(s)}"></label><label>Hasta<input type="datetime-local" step="900" id="xe" value="${fH(e)}"></label></div>
  <div class="h">Estado</div><div class="opt" id="ost"><label class="on"><input type="radio" name="st" value="P" checked>Preseleccionada</label><label><input type="radio" name="st" value="C">Confirmada</label></div>
  <div id="xw"></div><div class="err" id="xer"></div>
  <button class="big" id="xok">Guardar</button><button class="ghost" id="xwa">📲 Guardar y pedir confirmación por WhatsApp</button>`}
function asgWire(d,f){const opts=id=>document.querySelectorAll('#'+id+' label').forEach(l=>l.onclick=()=>setTimeout(()=>document.querySelectorAll('#'+id+' label').forEach(z=>z.classList.toggle('on',z.querySelector('input').checked)),0));opts('och');opts('ost');
 let gpsOk=0,ovr=0;const save=async(wa)=>{const er=$('#xer');er.textContent='';const ch=(document.querySelector('[name=ch]:checked')||{}).value,st=(document.querySelector('[name=st]:checked')||{}).value,s=pH($('#xs').value),e=pH($('#xe').value);
  if(!(e>s)){er.textContent='Revisá el horario.';return}if(st==='C'&&ch==='T'){er.textContent='Para confirmarla elegí el chofer. Si lo define el transporte, dejala preseleccionada y pedí la confirmación.';return}
  if(ch!=='T'&&e-s>12){er.textContent='Son más de 12 h: elegí «Lo define el transporte» para que arme los relevos por el link (o asignala desde el portal).';return}
  const v={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),f:f.id,o:d.o,s,e,c:st,d:d.id};if(ch==='T')v.tx=1;else v.cd=+ch;if(gpsOk)v.gpsOk=1;if(ovr)v.ovr=1;
  const bs=[$('#xok'),$('#xwa')];bs.forEach(b=>b.disabled=true);
  try{await api('ops',{ops:[{k:'put',e:'as',v}],bv:ST.ver});let msg='✔ '+f.un+' '+(st==='C'?'confirmada':'preseleccionada')+' en '+d.on;
   if(wa){const key=f.tipo==='Chasis TPR'?'TPR:'+String(f.t||'').trim().toUpperCase():String(f.t||'').trim().toUpperCase();await api('ops',{ops:[{k:'rq.new',dm:d.id,key}]});
    const j=await api('app.rqurl',{dm:d.id,key});wa={txt:j.txt,t:f.t}}
   toast(msg);VIEW=[{k:'d',id:d.id}];await load(true);if(wa)waSheet(wa.txt,wa.t)}
  catch(x){bs.forEach(b=>b.disabled=false);const m=x.message;er.textContent=m;

   else if(/responsabilidad/i.test(m)){$('#xw').innerHTML='<label class="ck"><input type="checkbox" id="co"> Asignar igual bajo mi responsabilidad</label>';$('#co').onchange=e=>{ovr=e.target.checked?1:0}}}};
 $('#xok').onclick=()=>save(false);$('#xwa').onclick=()=>save(true)}
/* mandar el pedido al GRUPO de WhatsApp del transporte: WhatsApp no deja que una app elija el grupo sola, así que se abre el menú
   Compartir (o WhatsApp) con el mensaje listo y se elige el grupo con un toque. El mensaje además queda copiado. */
function waSheet(txt,tn){const g=(ST.tg||{})[tn]||'',cp=()=>{try{const r=navigator.clipboard&&navigator.clipboard.writeText(txt);if(r&&r.catch)r.catch(()=>{})}catch(e){}};cp();
 let o=$('#wash');if(!o){o=document.createElement('div');o.id='wash';document.body.appendChild(o)}
 o.innerHTML=`<div class="wsb"><b>📲 Pedido listo para ${esc(tn||'el transporte')}</b>${g?`<div class="wsg">Mandalo al grupo: <b>${esc(g)}</b></div>`:'<div class="hr">Elegí el grupo de WhatsApp de este transporte.</div>'}
  <pre class="wsp">${esc(txt)}</pre><button class="big" id="wsgo">Compartir por WhatsApp</button><button class="ghost" id="wscp">Copiar mensaje</button><button class="ghost" id="wsx">Cerrar</button></div>`;o.className='on';
 $('#wsx').onclick=()=>{o.className=''};$('#wscp').onclick=()=>{cp();toast('Mensaje copiado: pegalo en el grupo')};
 $('#wsgo').onclick=async()=>{if(navigator.share){try{await navigator.share({text:txt});o.className='';return}catch(e){if(e&&e.name==='AbortError')return}}
  location.href='https://wa.me/?text='+encodeURIComponent(txt);o.className=''}}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='on';clearTimeout(e._t);e._t=setTimeout(()=>e.className='',3500)}
/* ---------- datos ---------- */
async function load(manual){if(busy)return;busy=true;if(manual&&$('#upd'))$('#upd').textContent='Actualizando…';
 try{const j=await api('app.st');if(!j.bv||j.bv<NEED_SRV){$('#upd').textContent='El sistema se está actualizando: probá en unos minutos';return}ST=j;const v=VIEW[VIEW.length-1];if(v&&['x','q','n','ef','e'].includes(v.k))head();else paint()}catch(e){if(e.message!=='auth'&&$('#upd'))$('#upd').textContent=e.message==='Failed to fetch'?'Sin conexión · reintentando':e.message}finally{busy=false}}
function start(){shell();load();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
TK?start():login();
