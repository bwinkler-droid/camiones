<title>TPR · Camiones</title>
<style>
/* App del celular · estado de las operaciones (Terminal Puerto Rosario). Habla con el mismo servidor del portal. */
:root{--navy:#213C74;--gold:#9D832F;--bg:#F3F5F9;--card:#fff;--fg:#17223A;--mut:#64708A;--line:#E1E6EF;--ok:#0F7A55;--okb:#E1F5EE;--wa:#8A5A0B;--wab:#FAEEDA;--bad:#B42318;--badb:#FCEBEB;--inf:#0C447C;--infb:#E6F1FB;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1522;--card:#18202F;--fg:#E8ECF4;--mut:#93A0B8;--line:#2A3446;--okb:#123A2D;--ok:#5DCAA5;--wab:#3B2C0F;--wa:#F2C46B;--badb:#3D1818;--bad:#F09595;--infb:#132B47;--inf:#9CC5F0;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .lg{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.top .lg img{height:30px}
.top .tt{flex:1;min-width:0}.top b{font-size:16px;display:block}.top small{font-size:11.5px;opacity:.8}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 10px;font-size:13px}
.gold{height:3px;background:var(--gold)}
.sal{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px))}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.kp b{display:block;font-size:22px}.kp span{font-size:11.5px;color:var(--mut)}
.h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 7px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:9px}
.cd .r{display:flex;justify-content:space-between;align-items:center;gap:8px}.cd .op{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}.cd .op i{width:11px;height:11px;border-radius:3px;display:inline-block}
.cd .hr{font-size:12.5px;color:var(--mut);margin-top:2px}
.bar{height:8px;border-radius:5px;background:var(--line);margin:9px 0 6px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}.c-ok{background:var(--okb);color:var(--ok)}.c-wa{background:var(--wab);color:var(--wa)}.c-bad{background:var(--badb);color:var(--bad)}.c-inf{background:var(--infb);color:var(--inf)}
.al{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;font-size:14px}.al .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.al small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mut)}.fl b{font-size:22px;display:block;color:var(--fg)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{border:0;background:transparent;padding:9px 0 11px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}nav button i{font-size:21px;font-style:normal}nav button.on{color:var(--navy)}
@media (prefers-color-scheme:dark){nav button.on{color:#9CC5F0}}
.bdg{background:#D03B3B;color:#fff;border-radius:999px;font-size:10px;padding:0 6px;margin-left:2px}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
/* ingreso */
.lgn{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 96px) 22px 28px;background:linear-gradient(170deg,var(--navy) 0 42%,var(--bg) 42%)}
.lgn .box{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lgn .lgw{display:flex;justify-content:center;margin:-62px 0 12px}.lgn .lgw div{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.15)}.lgn .lgw img{height:92px;display:block}
.lgn h1{text-align:center;font-size:19px;margin:4px 0 2px}.lgn p{text-align:center;color:var(--mut);margin:0 0 16px;font-size:13.5px}
.lgn label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}.lgn input{width:100%;font-size:17px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lgn button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:700}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;text-align:center}
.foot{font-size:11.5px;color:var(--mut);text-align:center;margin-top:14px}
</style></head>

function login(msg){clearInterval(timer);$('#app').innerHTML=`<div class="lgn"><div class="box"><div class="lgw"><div><img src="${LOGO}" alt="Terminal Puerto Rosario"></div></div>
 <h1>Camiones · Estado</h1><p>Terminal Puerto Rosario</p>
 ${SRV?`<label for="u">Usuario</label><input id="u" autocomplete="username" autocapitalize="none"><label for="p">Clave</label><input id="p" type="password" autocomplete="current-password"><button id="go">Ingresar</button>`:
 `<p class="err" style="text-align:center">Falta el link de instalación. Abrí esta app desde el link que da el portal en <b>Datos → 📱 App del celular</b>.</p>`}
 <div class="err" id="er">${esc(msg||'')}</div></div><div class="foot">Con tu usuario y clave del portal</div></div>`;
 if(!SRV)return;const go=async()=>{const b=$('#go');b.disabled=true;b.textContent='Ingresando…';$('#er').textContent='';
  try{const j=await api('login',{u:$('#u').value.trim(),p:$('#p').value,r:1,lite:1});if(j.role!=='admin'){$('#er').textContent='Por ahora la app es solo para administradores.';b.disabled=false;b.textContent='Ingresar';return}TK=j.t;LS.setItem('tpr_tk',TK);start()}
  catch(e){$('#er').textContent=e.message==='Failed to fetch'?'No hay conexión.':e.message;b.disabled=false;b.textContent='Ingresar'}};
 $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}
/* ---------- pantallas ---------- */
function shell(){$('#app').innerHTML=`<div class="top"><div class="lg"><img src="${LOGO}" alt="TPR"></div><div class="tt"><b>Camiones <span id="sal" class="sal"></span></b><small id="upd">Cargando…</small></div><button id="rf" aria-label="Actualizar">↻</button><button id="out" aria-label="Salir">Salir</button></div><div class="gold"></div>
 <main id="m"></main><nav><button data-t="a"><i>⏱</i>Ahora</button><button data-t="b"><i>⚠</i><span>Alertas <span id="bd"></span></span></button><button data-t="c"><i>🚚</i>Flota</button></nav>`;
 $('#rf').onclick=()=>load(true);$('#out').onclick=()=>{api('logout').catch(()=>{});TK='';LS.removeItem('tpr_tk');login()};
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;draw();window.scrollTo(0,0)})}
function draw(){if(!ST)return;const S=ST,m=$('#m');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
 const att=S.al.filter(a=>a.k==='r'||a.k==='y').length;$('#bd').innerHTML=att?`<span class="bdg">${att}</span>`:'';
 const sm=S.sal&&S.sal.sum;$('#sal').className='sal '+(!sm?'c-inf':sm.r?'c-bad':sm.y?'c-wa':'c-ok');$('#sal').textContent=!sm?'Salud —':sm.r?'● Salud: '+sm.r+' rojo':sm.y?'● Salud OK':'● Salud OK';
 $('#upd').textContent='Hola '+(S.me||'').split(' ')[0]+' · actualizado '+new Date(S.ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
 if(TAB==='a'){const cur=S.dm.filter(d=>d.cur),nx=S.dm.filter(d=>!d.cur),fal=S.dm.filter(d=>d.st!=='Por autorizar').reduce((t,d)=>t+d.falta,0);
  const card=d=>{const ok=d.conf>=d.v,ch=d.st==='Por autorizar'?['c-bad','por autorizar']:d.falta?['c-bad',d.conf+d.pend?(d.falta>1?'faltan '+d.falta:'falta 1'):'sin asignar']:d.pend?['c-wa','por confirmar']:['c-ok',d.conf+'/'+d.v];
   const lk=d.rq.map(r=>'esperando el link de '+esc(r.t)).join(' · ');
   return `<div class="cd"><div class="r"><span class="op"><i style="background:${OPC[d.o]||'#999'}"></i>${esc(d.on)}</span><span class="chip ${ch[0]}">${ch[1]}</span></div>
    <div class="hr">${rng(d.s,d.e,S.now)}${d.cur?' · termina en '+dur(d.e-S.now):' · empieza en '+dur(d.s-S.now)}${d.bq?' · '+esc(d.bq):''}${d.u?' · pidió '+esc(d.u):''}</div>
    <div class="bar"><i style="width:${Math.min(100,100*d.conf/d.v)}%;background:#1D9E75"></i><i style="width:${Math.min(100,100*d.pend/d.v)}%;background:#EF9F27"></i></div>
    <div class="hr">${d.conf} de ${d.v} confirmado${d.v>1?'s':''}${d.pend?' · '+d.pend+' por confirmar':''}${d.falta&&d.libres?' · hay '+d.libres+' libre'+(d.libres>1?'s':''):''}${d.sinGps?' · '+d.sinGps+' sin GPS':''}${lk?' · '+lk:''}</div></div>`};
  m.innerHTML=`<div class="kp"><div><b>${cur.length}</b><span>en curso</span></div><div><b>${nx.length}</b><span>próximas 24 h</span></div><div><b style="color:${fal?'var(--bad)':'var(--ok)'}">${fal}</b><span>camiones faltan</span></div></div>
   <div class="h">En curso</div>${cur.map(card).join('')||'<div class="empty">No hay operaciones en curso.</div>'}<div class="h">Próximas 24 h</div>${nx.map(card).join('')||'<div class="empty">No hay demandas en las próximas 24 h.</div>'}`}
 else if(TAB==='b'){const C={r:'#E24B4A',y:'#EF9F27',i:'#378ADD',g:'#888780'},it=a=>`<div class="al"><span class="dot" style="background:${C[a.k]}"></span><div><b>${esc(a.t)}</b><small>${esc(a.s||'')}</small></div></div>`;
  const A=S.al.filter(a=>a.k==='r'||a.k==='y').sort((a,b)=>(a.k==='r'?0:1)-(b.k==='r'?0:1)),B=S.al.filter(a=>a.k==='i'||a.k==='g'),sm=S.sal;
  const sl=sm?`<div class="al"><span class="dot" style="background:${sm.sum.r?'#E24B4A':sm.sum.y?'#EF9F27':'#1D9E75'}"></span><div><b>Salud del sistema: ${sm.sum.r?sm.sum.r+' punto'+(sm.sum.r>1?'s':'')+' en rojo':'todo funciona'}</b><small>${esc((sm.red||[]).concat(sm.yel||[]).slice(0,4).join(' · ')||'Sin observaciones')} · medido ${new Date(sm.at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</small></div></div>`:'';
  m.innerHTML=`<div class="h">Para atender</div>${A.map(it).join('')||'<div class="empty">✔ Nada para atender.</div>'}<div class="h">Para saber</div>${B.map(it).join('')}${sl}`}
 else{const F=S.fl,T={'Chasis TPR':'Chasis TPR',Playo:'Playos',Batea:'Bateas'};
  m.innerHTML=`<div class="fl"><div><b>${F.work}</b>trabajando ahora</div><div><b>${F.free}</b>libres</div><div><b style="color:${F.mant?'var(--bad)':'var(--fg)'}">${F.mant}</b>en mantenimiento</div><div><b style="color:${F.sinGps?'var(--wa)':'var(--fg)'}">${F.sinGps}</b>sin GPS</div></div>
   <div class="h">Libres ahora</div>${Object.keys(F.byT).map(t=>`<div class="cd"><div class="r"><span class="op">${esc(T[t]||t)}</span><span class="chip c-inf">${F.byT[t].length}</span></div><div class="hr">${F.byT[t].map(esc).join(' · ')}</div></div>`).join('')||'<div class="empty">No hay unidades libres ahora.</div>'}
   <div class="h">Fuera de servicio</div>${F.out.map(o=>`<div class="al"><span class="dot" style="background:#E24B4A"></span><div><b>${esc(o.u)}${o.t?' · '+esc(o.t):''}</b><small>${esc(o.n||'en mantenimiento')}</small></div></div>`).join('')||'<div class="empty">Ninguna unidad fuera de servicio.</div>'}`}}
async function load(manual){if(busy)return;busy=true;if(manual)$('#upd').textContent='Actualizando…';
 try{ST=await api('app.st');draw()}catch(e){if(e.message!=='auth'){$('#upd').textContent=e.message==='Failed to fetch'?'Sin conexión · reintentando':e.message}}finally{busy=false}}
function start(){shell();load();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
TK?start():login();
</script></body></html>
