<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3969">
<title>TPR Camiones · la app se mudó</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<style>
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fa;color:#1c2430}
.box{max-width:520px;margin:48px auto;padding:22px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{font-size:21px;color:#1B3969;margin:0 0 10px}a.b{display:block;text-align:center;margin:18px 0 8px;padding:12px;border-radius:10px;background:#1B3969;color:#fff;text-decoration:none;font-weight:700}
.mut{color:#6b7684;font-size:14px}
@media (prefers-color-scheme:dark){body{background:#0f141b;color:#e6e9ef}.box{background:#18202b}.mut{color:#9aa4b2}h1{color:#9db7e3}}
</style></head>
<body><div class="box" id="app"></div>
<script>
/* App del celular · desde la entrega 2026-11-26a la app se abre desde Apps Script (link del portal + ?app=1), con la cuenta de Google de TPR.
   Esta página solo queda para los celulares que tenían instalada la app vieja: los manda al link nuevo. */
const APP_V=15;
let sid='';try{sid=(localStorage.getItem('tpr_srv')||'').replace(/[^A-Za-z0-9_-]/g,'')}catch(e){}
const q=new URLSearchParams(location.search).get('s');if(q)sid=q.replace(/[^A-Za-z0-9_-]/g,'');
const url=sid?'https:'+String.fromCharCode(47,47)+'script.google.com/macros/s/'+sid+'/exec?app=1':'';
try{localStorage.removeItem('tpr_tk')}catch(e){}
document.getElementById('app').innerHTML='<h1>La app de camiones se mudó</h1><p>Ahora se abre con tu <b>cuenta de Google de TPR</b>, sin usuario ni clave aparte.</p>'+
 (url?'<a class="b" href="'+url+'">Abrir la app nueva</a><p class="mut">Después agregala a la pantalla de inicio desde ese link (en iPhone: Compartir → Agregar a inicio) y borrá este acceso viejo.</p>'
     :'<p class="mut">Pedile a Logística el link nuevo de la app (está en el portal, en Datos → App del celular).</p>');
</script></body></html>
